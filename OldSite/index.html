<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元子鹅の网站</title>
    <meta name="description" content="元子鹅的个人网站，分享技术与创作。">
    <meta name="theme-color" content="#6750A4">
    <link rel="icon" href="./Files/YuanZiE.png">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" as="style">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" as="style">
    <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body>
    <div id="app"></div>
    <script src="./assets/js/app.js"></script>
    <script>
        const main = App.init({ activeNav: 'home' });

        async function render() {
            const articles = await App.loadArticleIndex();
            const latest = articles.slice(0, 3);

            const latestCards = latest.map(a => `
                <a class="article-card" href="./article.html?id=${a.id}">
                    <img class="article-card-cover" src="./${a.cover}" alt="${App.escapeHtml(a.title)}" onerror="this.style.display='none'">
                    <div class="article-card-body">
                        <div class="article-card-title">${App.escapeHtml(a.title)}</div>
                        <div class="article-card-summary">${App.escapeHtml(a.summary || '')}</div>
                        <div class="article-card-meta">
                            <span>${App.formatDate(a.date)}</span>
                            ${a.category ? `<span class="chip chip-sm">${App.escapeHtml(a.category)}</span>` : ''}
                        </div>
                    </div>
                </a>
            `).join('');

            main.innerHTML = `
                <div class="page-container fade-in">
                    <!-- Hero -->
                    <div class="hero card-elevated">
                        <img class="hero-avatar" src="./Files/YuanZiE.png" alt="元子鹅">
                        <h1 class="hero-name">欢迎来到 元子鹅の网站</h1>
                        <p class="hero-desc">
                            分享技术与创作的小天地<br>
                            以后常来看看，说不定能发现什么好玩的呢
                        </p>
                    </div>

                    <!-- Latest Articles -->
                    ${latest.length > 0 ? `
                    <div class="section">
                        <div class="section-header">
                            <h2 class="section-title">最新文章</h2>
                            <a class="btn btn-text" href="./articles.html">
                                查看全部 <span class="material-symbols-rounded" style="font-size:18px;">arrow_forward</span>
                            </a>
                        </div>
                        <div class="article-grid">
                            ${latestCards}
                        </div>
                    </div>
                    ` : ''}

                    <!-- Links -->
                    <div class="section">
                        <h2 class="section-title mb-16">链接</h2>
                        <div class="links-grid">
                            <a class="link-card card-filled" href="https://space.bilibili.com/2120993834" target="_blank" rel="noopener">
                                <img class="link-card-icon" src="./Files/YZE_Bili.png" alt="Bilibili">
                                <div class="link-card-text">
                                    <h3>我的 Bilibili</h3>
                                    <p>点击跳转到我的 Bilibili 主页</p>
                                </div>
                                <span class="material-symbols-rounded link-card-arrow">open_in_new</span>
                            </a>
                            <a class="link-card card-filled" href="https://github.com/Original-YuanZiE" target="_blank" rel="noopener">
                                <div class="link-card-icon-placeholder">
                                    <span class="material-symbols-rounded">code</span>
                                </div>
                                <div class="link-card-text">
                                    <h3>GitHub</h3>
                                    <p>查看我的开源项目</p>
                                </div>
                                <span class="material-symbols-rounded link-card-arrow">open_in_new</span>
                            </a>
                        </div>
                    </div>

                    <footer class="footer">&copy; 2025 元子鹅 · Powered by GitHub Pages</footer>
                </div>
            `;
        }
        render();
    </script>
</body>
</html>
