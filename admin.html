<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 元子鹅の网站</title>
    <link rel="icon" href="./Files/YuanZiE.png">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" as="style">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" as="style">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/admin.css">
    <!-- Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Code highlighting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css" id="hljs-light">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" id="hljs-dark" disabled>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
</head>
<body>
    <div id="app"></div>
    <script src="./assets/js/app.js"></script>
    <script src="./assets/js/github.js"></script>
    <script src="./assets/js/editor.js"></script>
    <script src="./assets/js/admin.js"></script>
    <script>
        const main = App.init({ activeNav: 'admin', title: '管理后台' });

        // Update highlight.js theme
        function updateHljs() {
            const attr = document.documentElement.getAttribute('data-theme');
            const dark = attr === 'dark' || (!attr && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.getElementById('hljs-light').disabled = dark;
            document.getElementById('hljs-dark').disabled = !dark;
        }
        new MutationObserver(updateHljs).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
        updateHljs();

        if (Auth.isLoggedIn()) {
            Admin.renderDashboard(main);
        } else {
            Admin.renderLogin(main);
        }
    </script>
</body>
</html>
