<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 - 元子鹅の网站</title>
    <link rel="icon" href="./Files/YuanZiE.png">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" as="style">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" as="style">
    <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body>
    <div id="app"></div>
    <script src="./assets/js/app.js"></script>
    <script>
        const main = App.init({ activeNav: 'articles', title: '文章' });

        async function render() {
            const id = App.getArticleId();
            if (!id) {
                main.innerHTML = `<div class="article-detail"><div class="empty-state"><span class="material-symbols-rounded">error_outline</span><p>未指定文章</p><a class="btn btn-filled" href="./articles.html" style="margin-top:16px;">返回文章列表</a></div></div>`;
                return;
            }

            const articles = await App.loadArticleIndex();
            const article = articles.find(a => a.id === id);
            let content = await App.loadArticleContent(id);

            if (!content) {
                // Fallback: try old index.html
                try {
                    const r = await fetch(`./Articles/${id}/index.html`);
                    if (r.ok) {
                        const html = await r.text();
                        const doc = new DOMParser().parseFromString(html, 'text/html');
                        const el = doc.querySelector('mdui-layout-main') || doc.querySelector('body');
                        if (el) { renderArticle(article, el.innerHTML); return; }
                    }
                } catch {}
                main.innerHTML = `<div class="article-detail"><div class="empty-state"><span class="material-symbols-rounded">error_outline</span><p>文章未找到</p><a class="btn btn-filled" href="./articles.html" style="margin-top:16px;">返回文章列表</a></div></div>`;
                return;
            }
            renderArticle(article, content);
        }

        function renderArticle(article, content) {
            const t = article ? article.title : '文章';
            const d = article ? App.formatDate(article.date) : '';
            const cat = article ? article.category : '';
            const author = article ? article.author : '';
            const cover = article ? `./${article.cover}` : '';

            main.innerHTML = `
                <div class="article-detail fade-in">
                    ${cover ? `<img class="article-cover" src="${cover}" alt="${App.escapeHtml(t)}" onerror="this.style.display='none'">` : ''}
                    <h1 class="article-title">${App.escapeHtml(t)}</h1>
                    <div class="article-meta">
                        ${d ? `<span>${d}</span>` : ''}
                        ${cat ? `<span class="chip chip-sm">${App.escapeHtml(cat)}</span>` : ''}
                        ${author ? `<span>${App.escapeHtml(author)}</span>` : ''}
                    </div>
                    <div class="divider mb-24"></div>
                    <div class="article-content">${content}</div>
                    <div id="article-nav"></div>
                    <div style="margin-top:40px;text-align:center;">
                        <a class="btn btn-text" href="./articles.html">
                            <span class="material-symbols-rounded">arrow_back</span> 返回文章列表
                        </a>
                    </div>
                    <footer class="footer">&copy; 2025 元子鹅</footer>
                </div>
            `;

            // Prev/Next nav
            App.loadArticleIndex().then(articles => {
                const idx = articles.findIndex(a => a.id === article.id);
                const prev = idx < articles.length - 1 ? articles[idx + 1] : null;
                const next = idx > 0 ? articles[idx - 1] : null;
                let nav = '<div class="article-nav">';
                if (prev) nav += `<a href="./article.html?id=${prev.id}"><div class="article-nav-card"><div class="article-nav-label">上一篇</div><div class="article-nav-title">${App.escapeHtml(prev.title)}</div></div></a>`;
                if (next) nav += `<a href="./article.html?id=${next.id}"><div class="article-nav-card" style="text-align:right;"><div class="article-nav-label">下一篇</div><div class="article-nav-title">${App.escapeHtml(next.title)}</div></div></a>`;
                nav += '</div>';
                document.getElementById('article-nav').innerHTML = nav;
            });
        }

        render();
    </script>
</body>
</html>
