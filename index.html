<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="元子鹅的个人博客">
  <title>元子鹅的博客</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="Assets/favicon.png">

  <!-- Highlight.js theme (light default, dark overridden below) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
  <style>
    [data-theme="dark"] .hljs { color: #c9d1d9; background: var(--color-code-bg); }
    [data-theme="dark"] .hljs-keyword { color: #ff7b72; }
    [data-theme="dark"] .hljs-string { color: #a5d6ff; }
    [data-theme="dark"] .hljs-comment { color: #8b949e; }
    [data-theme="dark"] .hljs-function { color: #d2a8ff; }
    [data-theme="dark"] .hljs-number { color: #79c0ff; }
    [data-theme="dark"] .hljs-title { color: #d2a8ff; }
    [data-theme="dark"] .hljs-built_in { color: #ffa657; }
    [data-theme="dark"] .hljs-literal { color: #79c0ff; }
    [data-theme="dark"] .hljs-params { color: #c9d1d9; }
    [data-theme="dark"] .hljs-attr { color: #79c0ff; }
    [data-theme="dark"] .hljs-meta { color: #8b949e; }
    [data-theme="dark"] .hljs-type { color: #ffa657; }
    [data-theme="dark"] .hljs-variable { color: #ffa657; }
  </style>

  <!-- Site styles -->
  <link rel="stylesheet" href="Style/variables.css">
  <link rel="stylesheet" href="Style/base.css">
  <link rel="stylesheet" href="Style/layout.css">
  <link rel="stylesheet" href="Style/components.css">
  <link rel="stylesheet" href="Style/article.css">
  <link rel="stylesheet" href="Style/responsive.css">

  <!-- Inline critical: prevent flash of wrong theme -->
  <script>
    (function() {
      var t = localStorage.getItem('theme') || 'auto';
      var d;
      if (t === 'auto') {
        d = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } else {
        d = t;
      }
      document.documentElement.setAttribute('data-theme', d);
    })();
  </script>
</head>
<body>
  <div class="app">
    <!-- Top bar with blur — contains hamburger and back button -->
    <div class="top-bar" id="top-bar">
      <div class="top-bar-inner">
        <button class="hamburger" id="hamburger" aria-label="打开菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <a class="back-btn" id="back-btn" href="#/articles" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          <span>返回列表</span>
        </a>
      </div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-avatar">
          <img src="Assets/avatar.png" alt="头像" onerror="this.style.display='none'">
        </div>
        <div class="sidebar-name">元子鹅</div>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item" data-route="/" href="#/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>主页</span>
        </a>
        <a class="nav-item" data-route="/articles" href="#/articles">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>文章</span>
        </a>
        <a class="nav-item" data-route="/about" href="#/about">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><circle cx="12" cy="8" r="1" fill="currentColor" stroke="none"/></svg>
          <span>关于</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">
          <!-- Filled by theme.js -->
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <div id="app">
        <!-- Pages rendered here by router -->
      </div>
    </main>
  </div>

  <!-- CDN: Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- CDN: Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>

  <!-- Site scripts -->
  <script src="Script/theme.js"></script>
  <script src="Script/router.js"></script>
  <script src="Script/markdown.js"></script>
  <script src="Script/articles.js"></script>
  <script src="Script/sidebar.js"></script>
  <script src="Script/app.js"></script>
</body>
</html>
